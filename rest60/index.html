(()=>{
'use strict';
const $=id=>document.getElementById(id);
const time=$('time'),status=$('status'),ring=$('ring'),start=$('start'),reset=$('reset'),dial=$('dial'),test=$('soundTest'),hint=$('soundHint'),sets=$('sets'),setReset=$('setReset'),soundToggle=$('soundToggle');
const choices=[30,60,90],SR=16000,KEY='rest60-settings-v2',COUNT='rest60-count-v2';
function read(key){try{return JSON.parse(localStorage.getItem(key))}catch{return null}}
function save(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{}}
function dateKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
const saved=read(KEY)||{};
let seconds=choices.includes(saved.seconds)?saved.seconds:60,tickSound=saved.tickSound!==false;
let record=read(COUNT)||{};
function syncCount(){if(record.date!==dateKey()||!Number.isSafeInteger(record.count)||record.count<0){record={date:dateKey(),count:0};save(COUNT,record)}sets.textContent=String(record.count).padStart(2,'0');setReset.disabled=!!deadline||record.count===0}

function clickSample(t,warning=false){
 if(t<0||t>=.072)return 0;
 const f=warning?1.32:1;
 return .27*Math.exp(-t*65)*(Math.sin(2*Math.PI*1250*f*t)+.42*Math.sin(2*Math.PI*2350*f*t));
}
function alarmSample(t){
 // Original two-note ascending chime: soft mallet attack and airy decay.
 let value=0;
 for(const [offset,duration,freq,amp] of [[0,.39,659.255,.45],[.145,.565,987.767,.53]]){
  const x=t-offset;
  if(x<0||x>=duration)continue;
  const attack=1-Math.exp(-x/.009);
  const tail=Math.min(1,(duration-x)/.055);
  const fundamental=Math.sin(2*Math.PI*freq*x)*Math.exp(-x*5.5);
  const shimmer=.22*Math.sin(2*Math.PI*freq*2*x)*Math.exp(-x*13);

 }

}
function makeWav(duration,withTicks){
 const count=Math.round(SR*(duration+.76)),buffer=new ArrayBuffer(44+2*count),v=new DataView(buffer);

 str(0,'RIFF');v.setUint32(4,36+2*count,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,count*2,true);
