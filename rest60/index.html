<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101512"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="REST 60"><link rel="manifest" href="manifest.json?v=2"><link rel="apple-touch-icon" sizes="180x180" href="rest60-icon-v2-180.png"><link rel="apple-touch-icon-precomposed" sizes="180x180" href="rest60-icon-v2-180.png"><link rel="icon" href="icon.svg"><title>REST 60 | 筋トレ休憩タイマー</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans',sans-serif;background:#101512;color:#f5faf6}body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom))}.app{width:min(100%,400px);text-align:center}.brand{font-size:24px;font-weight:900;letter-spacing:.12em;margin:0}.brand span{color:#bafc6b}.sub{font-size:12px;letter-spacing:.12em;color:#a4b1a7;margin:9px 0 29px}.dial{position:relative;width:min(100%,310px);aspect-ratio:1;margin:0 auto 24px}.dial svg{width:100%;height:100%;transform:rotate(-90deg)}.dial circle{fill:none;stroke-width:8}.track{stroke:#2b3730}.progress{stroke:#bafc6b;stroke-linecap:round;transition:stroke-dashoffset .15s linear}.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.time{font-size:clamp(64px,19vw,91px);font-weight:800;line-height:1.1;letter-spacing:-.07em;font-variant-numeric:tabular-nums;margin-right:.07em}.status{font-size:14px;font-weight:700;color:#bafc6b;letter-spacing:.08em;margin-top:10px}.start{width:100%;height:78px;border:0;border-radius:22px;background:#bafc6b;color:#162011;font:inherit;font-weight:850;font-size:25px;cursor:pointer;touch-action:manipulation}.start:disabled{background:#26332a;color:#a4b1a7;cursor:default}.reset{border:0;background:none;color:#b7c2ba;font:inherit;font-size:14px;padding:18px 24px;min-height:52px;cursor:pointer;touch-action:manipulation}.reset:disabled{visibility:hidden}.note{color:#a4b1a7;font-size:12px;line-height:1.7;margin:0}.done .progress{stroke:#fff}.done .status{color:#f5faf6}button:focus-visible{outline:3px solid white;outline-offset:4px}@media(prefers-reduced-motion:reduce){.progress{transition:none}}
.sound-test{display:block;margin:12px auto 0;border:1px solid #45574a;border-radius:12px;background:transparent;color:#bafc6b;font:inherit;font-size:12px;padding:10px 15px;cursor:pointer;touch-action:manipulation}.sound-test:disabled{opacity:.35;cursor:default}.version{color:#839087;font-size:10px;margin:12px 0 0;letter-spacing:.08em}</style></head><body><main class="app"><h1 class="brand">REST<span> 60</span></h1><p class="sub">筋トレ休憩タイマー</p><div class="dial" id="dial"><svg viewBox="0 0 280 280" aria-hidden="true"><circle class="track" cx="140" cy="140" r="130"/><circle id="ring" class="progress" cx="140" cy="140" r="130" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg><div class="face"><div class="time" id="time" role="timer" aria-label="残り時間">1:00</div><div id="status" class="status" role="status">休憩スタート</div></div></div><button class="start" id="start">▶ スタート</button><button class="reset" id="reset" disabled>リセット</button><p class="note">毎秒カチッ、60秒後に終了音。<br><span id="soundHint">音量を上げ、画面を開いた状態でご使用ください。</span></p><button class="sound-test" id="soundTest" type="button">🔊 終了音を確認</button><p class="version">Ver. 1.2</p></main><script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const time=$('time'),status=$('status'),ring=$('ring'),start=$('start'),reset=$('reset'),dial=$('dial'),test=$('soundTest'),hint=$('soundHint');
const DURATION=60000,SR=16000;
let deadline=0,interval=0,runId=0,lastSecond=60,wake=null,ac=null,mode='idle',nodes=[],testId=0;
function clickSample(t){
 if(t<0||t>=.072)return 0;
 return .27*Math.exp(-t*65)*(Math.sin(2*Math.PI*1250*t)+.42*Math.sin(2*Math.PI*2350*t));
}
function alarmSample(t){
 // Original two-note ascending chime: soft mallet attack and airy decay.
 let value=0;
 for(const [offset,duration,freq,amp] of [[0,.39,659.255,.45],[.145,.565,987.767,.53]]){
  const x=t-offset;
  if(x<0||x>=duration)continue;
  const attack=1-Math.exp(-x/.009);
  const tail=Math.min(1,(duration-x)/.055);
  const fundamental=Math.sin(2*Math.PI*freq*x)*Math.exp(-x*5.5);
  const shimmer=.22*Math.sin(2*Math.PI*freq*2*x)*Math.exp(-x*13);
  const air=.055*Math.sin(2*Math.PI*freq*3*x)*Math.exp(-x*23);
  value+=amp*attack*tail*(fundamental+shimmer+air);
 }
 return value;
}
function makeWav(full){
 const count=Math.round(SR*(full?60.76:.76));
 const buffer=new ArrayBuffer(44+2*count),v=new DataView(buffer);
 const str=(p,s)=>{for(let i=0;i<s.length;i++)v.setUint8(p+i,s.charCodeAt(i))};
 str(0,'RIFF');v.setUint32(4,36+2*count,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,count*2,true);
 for(let i=0;i<count;i++){const t=i/SR;const x=full?(t<60?clickSample(t-Math.floor(t)):alarmSample(t-60)):alarmSample(t);v.setInt16(44+2*i,Math.round(Math.max(-1,Math.min(1,x))*32767),true)}
 return URL.createObjectURL(new Blob([buffer],{type:'audio/wav'}));
}
function player(full){const a=new Audio();a.preload='auto';a.src=makeWav(full);a.load();return a}
const track=player(true),preview=player(false);
function stopMedia(a){try{a.pause();a.currentTime=0}catch{}}
function clearNodes(){for(const o of nodes){try{o.stop()}catch{}}nodes=[]}
function unlock(){
 try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch{}
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!ac)ac=new C();if(ac.state!=='running')ac.resume().catch(()=>{})}catch{}
}
function tone(freq,duration,volume,offset=0,type='sine'){
 if(!ac||ac.state!=='running')return false;
 try{const t=ac.currentTime+offset,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(volume,t+.006);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+duration+.01);nodes.push(o);o.onended=()=>{o.disconnect();g.disconnect();nodes=nodes.filter(x=>x!==o)};return true}catch{return false}
}
function fallbackAlarm(){
 if(!ac||ac.state!=='running')return false;
 try{
  const length=Math.round(SR*.76),buf=ac.createBuffer(1,length,SR),data=buf.getChannelData(0);
  for(let i=0;i<length;i++)data[i]=alarmSample(i/SR);
  const source=ac.createBufferSource();source.buffer=buf;source.connect(ac.destination);
  nodes.push(source);source.onended=()=>{source.disconnect();nodes=nodes.filter(n=>n!==source)};
  source.start();return true;
 }catch{return false}
}
function fallbackClick(){return tone(1450,.065,.24,0,'triangle')}
function warn(){hint.textContent='音が出ない場合：メディア音量・消音設定・Bluetooth接続を確認してください。'}
function showHint(){hint.textContent='音量を上げ、画面を開いた状態でご使用ください。'}
function useFallback(id){if(id!==runId||!deadline)return;stopMedia(track);mode='fallback';if(!fallbackClick())warn()}
track.addEventListener('error',()=>{if(deadline&&mode==='media')useFallback(runId)});
function release(){const w=wake;wake=null;if(w)w.release().catch(()=>{})}
async function lock(id){try{if(!navigator.wakeLock||document.hidden||wake)return;const w=await navigator.wakeLock.request('screen');if(id!==runId||!deadline||wake){await w.release();return}wake=w;w.addEventListener('release',()=>{if(wake===w)wake=null})}catch{}}
function draw(ms){const s=Math.ceil(ms/1000);time.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');ring.setAttribute('stroke-dashoffset',String(100-ms/600))}
function ready(done=false){runId++;clearInterval(interval);interval=0;deadline=0;release();draw(DURATION);start.disabled=false;start.textContent='▶ スタート';reset.disabled=true;test.disabled=false;status.textContent=done?'休憩終了！ 次のセットへ':'休憩スタート';dial.classList.toggle('done',done);document.title=done?'休憩終了 | REST 60':'REST 60 | 筋トレ休憩タイマー'}
function finish(){
 // The main media file contains its own alarm at 60 seconds.
 // If it was interrupted, use the separate alarm or the oscillator fallback.
 if(mode!=='media'||track.paused||track.ended||track.currentTime<59.2){
  stopMedia(track);
  try{const finishedId=runId+1;const p=preview.play();if(p)p.catch(()=>{if(runId===finishedId&&!deadline&&!fallbackAlarm())warn()})}catch{if(!fallbackAlarm())warn()}
 }
 try{navigator.vibrate?.([180,90,180])}catch{}
 ready(true);mode='idle';
}
function tick(){if(!deadline)return;const remaining=Math.max(0,deadline-Date.now());if(!remaining){finish();return}const sec=Math.ceil(remaining/1000);
 if(sec!==lastSecond){lastSecond=sec;if(mode==='fallback'&&!fallbackClick())warn()}
 draw(remaining);document.title=time.textContent+' | REST 60'
}
start.addEventListener('click',()=>{
 if(deadline)return;
 testId++;stopMedia(track);stopMedia(preview);clearNodes();showHint();unlock();
 deadline=Date.now()+DURATION;const id=++runId;lastSecond=60;mode='media';
 dial.classList.remove('done');status.textContent='休憩中';start.disabled=true;start.textContent='計測中…';reset.disabled=false;test.disabled=true;
 // play() is invoked synchronously inside the user tap, not after a timeout.
 try{const p=track.play();if(p)p.catch(()=>useFallback(id))}catch{useFallback(id)}
 tick();interval=setInterval(tick,80);lock(id)
});
reset.addEventListener('click',()=>{testId++;stopMedia(track);stopMedia(preview);clearNodes();mode='idle';showHint();ready()});
test.addEventListener('click',()=>{if(deadline)return;const id=++testId;stopMedia(track);stopMedia(preview);clearNodes();showHint();unlock();try{const p=preview.play();if(p)p.catch(()=>{if(id===testId&&!deadline&&!fallbackAlarm())warn()})}catch{if(!fallbackAlarm())warn()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden||!deadline)return;tick();if(!deadline)return;lock(runId);if(mode==='media'&&track.paused){const id=runId;try{track.currentTime=Math.min(59.95,(DURATION-(deadline-Date.now()))/1000);const p=track.play();if(p)p.catch(()=>useFallback(id))}catch{useFallback(id)}}});
ready();
})();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).then(r=>r.update().catch(()=>{})).catch(()=>{});
</script></body></html>
