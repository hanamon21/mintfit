<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101512"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="REST 60"><link rel="manifest" href="manifest.json?v=2"><link rel="apple-touch-icon" sizes="180x180" href="rest60-icon-v2-180.png"><link rel="apple-touch-icon-precomposed" sizes="180x180" href="rest60-icon-v2-180.png"><link rel="icon" href="icon.svg"><title>REST 60 | 筋トレ休憩タイマー</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans',sans-serif;background:#101512;color:#f5faf6}body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom))}.app{width:min(100%,400px);text-align:center}.brand{font-size:24px;font-weight:900;letter-spacing:.12em;margin:0}.brand span{color:#bafc6b}.sub{font-size:12px;letter-spacing:.12em;color:#a4b1a7;margin:9px 0 29px}.dial{position:relative;width:min(100%,310px);aspect-ratio:1;margin:0 auto 24px}.dial svg{width:100%;height:100%;transform:rotate(-90deg)}.dial circle{fill:none;stroke-width:8}.track{stroke:#2b3730}.progress{stroke:#bafc6b;stroke-linecap:round;transition:stroke-dashoffset .15s linear}.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.time{font-size:clamp(64px,19vw,91px);font-weight:800;line-height:1.1;letter-spacing:-.07em;font-variant-numeric:tabular-nums;margin-right:.07em}.status{font-size:14px;font-weight:700;color:#bafc6b;letter-spacing:.08em;margin-top:10px}.start{width:100%;height:78px;border:0;border-radius:22px;background:#bafc6b;color:#162011;font:inherit;font-weight:850;font-size:25px;cursor:pointer;touch-action:manipulation}.start:disabled{background:#26332a;color:#a4b1a7;cursor:default}.reset{border:0;background:none;color:#b7c2ba;font:inherit;font-size:14px;padding:18px 24px;min-height:52px;cursor:pointer;touch-action:manipulation}.reset:disabled{visibility:hidden}.note{color:#a4b1a7;font-size:12px;line-height:1.7;margin:0}.done .progress{stroke:#fff}.done .status{color:#f5faf6}button:focus-visible{outline:3px solid white;outline-offset:4px}@media(prefers-reduced-motion:reduce){.progress{transition:none}}
</style></head><body><main class="app"><h1 class="brand">REST<span> 60</span></h1><p class="sub">筋トレ休憩タイマー</p><div class="dial" id="dial"><svg viewBox="0 0 280 280" aria-hidden="true"><circle class="track" cx="140" cy="140" r="130"/><circle id="ring" class="progress" cx="140" cy="140" r="130" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg><div class="face"><div class="time" id="time" role="timer" aria-label="残り時間">1:00</div><div id="status" class="status" role="status">休憩スタート</div></div></div><button class="start" id="start">▶ スタート</button><button class="reset" id="reset" disabled>リセット</button><p class="note">60秒後に終了音。次の休憩はもう一度タップ。<br>音量を上げ、画面を開いた状態でご使用ください。</p></main><script>
(()=>{const time=document.getElementById('time'),status=document.getElementById('status'),ring=document.getElementById('ring'),start=document.getElementById('start'),reset=document.getElementById('reset'),dial=document.getElementById('dial');let deadline=0,interval=0,ac=null,wake=null,runId=0,alarmNodes=[];const clearAlarm=()=>{for(const o of alarmNodes){try{o.stop()}catch{}}alarmNodes=[]};const unlockAudio=()=>{try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!ac)ac=new C();if(ac.state!=='running')ac.resume().catch(()=>{});}catch{}};const beep=()=>{try{if(ac&&ac.state==='running'){const t=ac.currentTime;[0,.24,.48].forEach((d,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=i===2?1046:880;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.3,t+d+.015);g.gain.exponentialRampToValueAtTime(.001,t+d+.18);o.connect(g);g.connect(ac.destination);o.start(t+d);o.stop(t+d+.19);alarmNodes.push(o);o.onended=()=>{o.disconnect();g.disconnect();alarmNodes=alarmNodes.filter(x=>x!==o)}})}}catch{}try{navigator.vibrate?.([180,90,180])}catch{}};const release=()=>{const w=wake;wake=null;if(w)w.release().catch(()=>{})};async function lock(id){try{if(!navigator.wakeLock||document.hidden||wake)return;const w=await navigator.wakeLock.request('screen');if(id!==runId||!deadline||wake){await w.release();return}wake=w;w.addEventListener('release',()=>{if(wake===w)wake=null})}catch{}}function draw(ms){const s=Math.ceil(ms/1000);time.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');ring.setAttribute('stroke-dashoffset',String(100-ms/600));}function ready(done=false){runId++;clearInterval(interval);interval=0;deadline=0;release();draw(60000);start.disabled=false;start.textContent='▶ スタート';reset.disabled=true;status.textContent=done?'休憩終了！ 次のセットへ':'休憩スタート';dial.classList.toggle('done',done);document.title=done?'休憩終了 | REST 60':'REST 60 | 筋トレ休憩タイマー'}function tick(){if(!deadline)return;const remaining=Math.max(0,deadline-Date.now());if(!remaining){beep();ready(true);return}draw(remaining);document.title=time.textContent+' | REST 60'}start.addEventListener('click',()=>{if(deadline)return;clearAlarm();unlockAudio();deadline=Date.now()+60000;runId++;dial.classList.remove('done');status.textContent='休憩中';start.disabled=true;start.textContent='計測中…';reset.disabled=false;tick();interval=setInterval(tick,100);lock(runId)});reset.addEventListener('click',()=>{clearAlarm();ready()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&deadline){tick();if(deadline)lock(runId)}});ready();})();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
</script></body></html>
